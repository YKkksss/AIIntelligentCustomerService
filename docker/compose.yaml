# AICS 本机开发依赖服务（PostgreSQL / Redis / RabbitMQ / Qdrant）。
#
# 只给开发机用：所有端口只绑定 127.0.0.1，数据落在 docker/volumes/ 下（已在 .gitignore 中忽略），
# 删掉目录即完全重置。库名、vhost、ACL、集合前缀与服务器共享中间件保持一致（见
# deploy/server/bootstrap/ 与 docs/07-deployment/01-服务器准备与共享服务.md），
# 这样集成测试与真实链路同构：AICS DB 库号 5、Celery 结果库号 6、集成测试库号 7。
#
# 用法：见 docker/README.md
#   cd docker && cp .env.example .env   # 或执行 .\dev-stack.ps1 init 自动生成随机密码
#   docker compose up -d
name: aics-dev

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: aics-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?请在 docker/.env 中设置}
      # 供 init/postgres/01-aics.sh 创建 aics 角色使用
      AICS_DB_PASSWORD: ${AICS_DB_PASSWORD:?请在 docker/.env 中设置}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${AICS_DB_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aics -d aics"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: redis:8.2.9-alpine
    container_name: aics-dev-redis
    restart: unless-stopped
    environment:
      AICS_REDIS_PASSWORD: ${AICS_REDIS_PASSWORD:?请在 docker/.env 中设置}
    # 与服务器同一套 ACL：只允许 aics:* / celery-task-meta-* / chord-unlock-* 的键与频道，
    # 且禁用管理类与危险命令（default 用户关闭）。acl 文件在容器内生成，密码不进仓库。
    command:
      - sh
      - -c
      - >-
        printf '%s\n' 'user default off'
        "user aics on >$${AICS_REDIS_PASSWORD} ~aics:* ~celery-task-meta-* ~chord-unlock-*
        &aics:* &celery-task-meta-* &chord-unlock-* +@all -@admin -@dangerous"
        > /data/users.acl &&
        exec redis-server --aclfile /data/users.acl --dir /data --appendonly yes
    ports:
      - "127.0.0.1:${AICS_REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -u redis://aics:$${AICS_REDIS_PASSWORD}@127.0.0.1:6379/5 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 24

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: aics-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: aics
      RABBITMQ_DEFAULT_PASS: ${AICS_MQ_PASSWORD:?请在 docker/.env 中设置}
      RABBITMQ_DEFAULT_VHOST: aics
    ports:
      - "127.0.0.1:${AICS_MQ_PORT:-5672}:5672"
      - "127.0.0.1:${AICS_MQ_UI_PORT:-15672}:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: aics-dev-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${AICS_QDRANT_API_KEY:?请在 docker/.env 中设置}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${AICS_QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${AICS_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 24
