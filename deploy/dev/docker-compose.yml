# 仅本机开发用：独立 Qdrant（与服务器上 KnowledgeFlow 的实例同版本）。
# 服务器不部署此文件——AICS 在服务器上共用 KnowledgeFlow 的 Qdrant（ADR-0002 修订）。
# 用法：cp deploy/dev/.env.example deploy/dev/.env && docker compose -f deploy/dev/docker-compose.yml up -d
name: aics-dev
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: aics-dev-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?请在 deploy/dev/.env 中设置}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
volumes:
  qdrant-data:
