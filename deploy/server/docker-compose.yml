# AICS 服务器侧编排：只包含本项目自建的 Qdrant。
# PostgreSQL / Redis / RabbitMQ 复用服务器已有容器，不在此处。
# 用法见 docs/07-deployment/02-Qdrant部署.md
name: aics
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4   # 部署前确认最新稳定版并固定版本号
    container_name: aics-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?请在 deploy/server/.env 中设置}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes:
      - /data/aics/qdrant/storage:/qdrant/storage
      - /data/aics/qdrant/snapshots:/qdrant/snapshots
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
