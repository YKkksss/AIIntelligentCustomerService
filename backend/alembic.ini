# Alembic config. The database URL comes from AICS_DB_URL (aics.core.config), never here.
# Keep this file pure ASCII: Alembic reads it with the *locale* encoding, which is GBK on
# Chinese Windows and would raise UnicodeDecodeError on non-ASCII comments.
[alembic]
script_location = %(here)s/migrations
path_separator = os
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
