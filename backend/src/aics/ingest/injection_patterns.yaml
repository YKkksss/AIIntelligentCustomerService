# 入库注入检测规则（安全设计 §3 第 5 条、文档处理流水线 §3 第 5 步）
# - 命中只把切块标为待复核（review_status=flagged），不删除；宁可多标，由管理员复核。
# - zh 规则在“去掉全部空白”的文本上匹配（防“忽 略 以 上”）；en 规则在“小写 + 空白折叠”的文本上匹配。
# - 匹配前统一 NFKC 归一化（全角转半角）并删除零宽字符。
# - 修改本文件只影响之后的构建；已入库切块需重建。
version: 1
zh:
  ignore_previous: "忽略(掉)?(以上|上面|上述|之前|前面|先前|此前|所有|全部|一切)的?(所有|全部|一切)?的?(指令|指示|提示|提示词|规则|要求|设定|约束|对话|内容)"
  forget_previous: "忘(记|掉)(以上|上面|上述|之前|前面|所有|全部|你)的?(所有|全部)?的?(指令|指示|提示|提示词|规则|设定|约束)"
  role_override: "(你现在是|从现在(开始|起)[,，]?你(是|将|要|就是)|现在开始你(是|扮演)|请你?扮演|你的新(身份|角色|任务)是)"
  reveal_prompt: "(输出|显示|打印|泄露|透露|告诉我|重复)(一下)?你?的?(系统提示词|系统提示|系统指令|初始指令|隐藏指令|systemprompt)"
  bypass_rules: "(不要|无需|不必|不用)(再)?(遵守|遵循|理会|受)(任何)?的?(规则|限制|指令|约束)"
en:
  ignore_previous: "\\b(ignore|disregard|skip|override)\\s+(all\\s+|any\\s+|the\\s+)*(previous|prior|above|earlier|preceding|former|system)\\s+(instructions?|prompts?|rules|directions|messages|context)\\b"
  forget_previous: "\\bforget\\s+(all\\s+|everything\\s+|your\\s+|the\\s+)*(previous|prior|above|earlier)?\\s*(instructions?|rules|prompts?)\\b"
  role_override: "\\b(you\\s+are\\s+now\\s+(a|an|the|in|my)\\b|from\\s+now\\s+on,?\\s+you\\s+(are|will)\\b|pretend\\s+(you\\s+are|to\\s+be)\\b)"
  reveal_prompt: "\\b(reveal|print|show|output|repeat|leak)\\s+(me\\s+)?(your|the)\\s+(system|initial|hidden|original)\\s+(prompt|instructions?)\\b"
  jailbreak_mode: "\\b(developer|dan|jailbreak|god)\\s+mode\\b"
  chat_template: "(<\\|im_start\\|>|<\\|im_end\\|>|<\\|system\\|>|<\\|endoftext\\|>|\\[/?inst\\]|<</?sys>>|^\\s*#{2,}\\s*(system|instruction)\\s*:)"
