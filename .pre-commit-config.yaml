# 安装：uv tool install pre-commit && pre-commit install
# 全量检查：pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.pen$
      - id: end-of-file-fixer
        exclude: \.pen$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$   # tsconfig 允许注释
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter（模块依赖规则）
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: prompt-versions
        name: 提示词版本检查
        entry: bash -c 'cd backend && uv run python -m aics.core.prompts check'
        language: system
        pass_filenames: false
        files: ^backend/(src/aics/.*/prompts/.*\.md|prompts\.lock\.json)$
